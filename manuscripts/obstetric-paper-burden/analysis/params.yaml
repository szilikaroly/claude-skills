# Parameters for the obstetric paper-burden micro-costing model.
# Every number the manuscript reports is derived from this file plus the page-count
# dataset. Nothing is hard-coded in analysis.py.
#
# status: firm    = sourced, usable in the base case
#         assumed = defensible convention, carried in sensitivity analysis
#         todo    = NOT YET SOURCED; outputs depending on it are suppressed

dataset:
  sheet: Munka1
  id_column: A
  total_column: "Összsen"      # workbook's own SUM column, used as a cross-check only

# ---------------------------------------------------------------------------
# Document families. `column` must match the workbook header exactly.
# `pairs_with` marks a result document generated by a referral document.
# ---------------------------------------------------------------------------
documents:
  - key: lab_ref
    label: Laboratory referral
    column: "Labor beutaló"
    family: Laboratory
    role: referral
    retention_years: 30
  - key: lab_res
    label: Laboratory report
    column: "Labor lelet"
    family: Laboratory
    role: result
    pairs_with: lab_ref
    retention_years: 30
  - key: abo_ref
    label: Blood-group referral
    column: "Vércsoport"
    family: Blood group
    role: referral
    retention_years: 30
  - key: abo_res
    label: Blood-group report
    column: "VCs lelet"
    family: Blood group
    role: result
    pairs_with: abo_ref
    retention_years: 30
  - key: mic_ref
    label: Microbiology referral
    column: "Mikrobiológia"
    family: Microbiology
    role: referral
    retention_years: 30
  - key: mic_res
    label: Microbiology report
    column: "Mikrobiológiai lelet"
    family: Microbiology
    role: result
    pairs_with: mic_ref
    retention_years: 30
  - key: usg_res
    label: Ultrasound report
    column: "Ultrahang lelet"
    family: Ultrasound
    role: result
    retention_years: 30
    pages_per_document: 1                # status: assumed - no paired referral to count from
  - key: book
    label: Antenatal care booklet
    column: "Terheskönyv"
    family: Antenatal booklet
    role: record
    retention_years: 30
    # The workbook records one booklet per episode. The booklet is a bound,
    # pre-printed, double-sided 15-page item, so one recorded unit = 15 printed
    # pages on 8 sheets, fixed in every scenario (our printing policy cannot
    # change how a pre-printed booklet is manufactured).
    pages_per_unit: 15                   # status: firm - author-supplied
    preprinted_duplex: true
    unit_price: 70                       # status: firm - author-supplied, HUF per booklet
    # Purchased as a finished booklet, not printed by the institution: it incurs
    # no paper or toner cost here, but it still occupies archive space.
    purchased: true
  - key: ward
    label: Ward documentation
    column: "Osztályos dokumentáció"
    family: Inpatient
    role: record
    retention_years: 50
  - key: birth
    label: Delivery documentation
    column: "Szülés dokumentáció"
    family: Inpatient
    role: record
    retention_years: 50

# ---------------------------------------------------------------------------
# Scale
# ---------------------------------------------------------------------------
scale:
  local_episodes_per_year: 2000          # status: assumed - university department volume
  local_label: "University department"
  national_episodes_per_year: 77500      # status: firm - KSH, live births Hungary 2024
  national_episodes_low: 70000           # status: assumed - sensitivity, continued decline
  national_episodes_high: 85000          # status: assumed - sensitivity, 2022 level
  national_label: "Hungary"

# ---------------------------------------------------------------------------
# Physical constants of A4 80 g/m2 office paper
# ---------------------------------------------------------------------------
physical:
  sheet_area_m2: 0.06237                 # status: firm - ISO 216 A4, 210 x 297 mm
  grammage_g_m2: 80                      # status: firm - specification of the procured paper
  sheets_per_linear_metre: 10000         # status: assumed - filed records incl. covers
  sheets_per_linear_metre_low: 8000
  sheets_per_linear_metre_high: 12000
  linear_metres_per_m2_floor: 5.5        # status: assumed - shelving incl. aisle allowance
  linear_metres_per_m2_floor_low: 4.0
  linear_metres_per_m2_floor_high: 7.0

# ---------------------------------------------------------------------------
# Unit costs, HUF. Base case is NET of VAT (public providers reclaim little VAT,
# so the gross figure is reported alongside).
# ---------------------------------------------------------------------------
costs:
  currency: HUF
  price_year: 2024
  vat_rate: 0.27                         # status: firm - Hungarian standard VAT

  # KEF (Kozbeszerzesi es Ellatasi Foigazgatosag) centralised public procurement,
  # framework agreement price for A4 80 g/m2 copier paper, 500-sheet ream.
  #   net   1430-1460 HUF/ream   (base case 1445)
  #   gross 1815-1855 HUF/ream   at the 27% standard rate (1445 x 1.27 = 1835)
  # sources:
  #   https://www.parlament.hu/documents/d/guest/10_2023_megrendelo
  #   https://kereso-core.kozbeszerzes.hu/csatolmany/letoltes/dokumentumtar/2024/
  #     3c86812a-fbb4-4785-8ea7-f799d5dfa857/91f49eeb-896e-448d-a9cc-9b40b1c14959.pdf
  paper_per_ream_net: 1445               # status: firm
  paper_per_ream_net_low: 1430           # status: firm
  paper_per_ream_net_high: 1460          # status: firm
  paper_per_ream_gross_low: 1815         # status: firm - reported, not used in computation
  paper_per_ream_gross_high: 1855        # status: firm - reported, not used in computation
  sheets_per_ream: 500

  # Property value of archive floor area (capital tied up, not annual rent).
  # NAV (national tax authority) property valuation applicable to the archive site.
  # A capital value - the property the archive immobilises - not an annual rent.
  floor_value_per_m2: 1560000            # status: firm
  floor_value_per_m2_low: 1200000        # status: assumed - sensitivity
  floor_value_per_m2_high: 1900000

  # Printing cost per printed page: toner, device amortisation and service.
  # INTERPRETATION: taken as the cost of putting ink on a page, EXCLUSIVE of the
  # paper itself, which is priced separately above. If the 7 HUF figure is an
  # all-in cost-per-page that already includes paper, set the flag below to true
  # and paper is no longer added on top.
  print_per_page: 7                      # status: firm - author-supplied, Hungarian average
  print_per_page_low: 5                  # status: assumed - sensitivity
  print_per_page_high: 10                # status: assumed - sensitivity
  print_cost_includes_paper: false       # status: assumed - see interpretation note

  # --- NOT YET SOURCED: outputs that need these are suppressed -------------
  archivist_huf_per_hour: null           # status: todo - gross employer cost per hour
  minutes_per_episode_handling: null     # status: todo - print/collate/file time, time-and-motion
  minutes_per_dossier_appraisal: null    # status: todo - retention-split appraisal at 30/50/70 y

# ---------------------------------------------------------------------------
# Staff time spent printing and filing paper documents. This is handling time
# only - not total documentation time - and is reported in hours and FTE even
# where no wage rate is available.
# ---------------------------------------------------------------------------
time:
  # Which document roles incur print-and-file handling. Ward and delivery
  # documentation are written during care rather than printed on demand, so
  # their production time is clinical documentation time, not handling time,
  # and they are excluded here.
  handling_roles: [referral, result]
  seconds_per_document: 30               # status: assumed - author-supplied lower bound
  seconds_per_document_low: 20
  seconds_per_document_high: 60
  annual_hours_per_fte: 1720             # status: assumed - Hungarian full-time year

# Archive floor area is not neutral space: it is taken out of clinical or
# productive use. These reference areas express the archive in clinical terms.
space_equivalents:
  antenatal_consulting_room_m2: 18       # status: assumed - typical room area
  delivery_room_m2: 35                   # status: assumed - typical room area

discounting:
  rate: 0.037                            # status: firm - Hungarian HTA guideline
  horizon_years: 10

# ---------------------------------------------------------------------------
# Environmental factors per tonne of uncoated woodfree paper (cradle-to-gate).
# Reported as an illustrative secondary outcome only - see manuscript limitations.
# ---------------------------------------------------------------------------
environment:
  status: illustrative
  co2e_t_per_t: 1.3
  co2e_t_per_t_low: 1.0
  co2e_t_per_t_high: 1.8
  water_m3_per_t: 15
  wood_t_per_t: 2.4

# ---------------------------------------------------------------------------
# Scenarios. `drop` removes those document keys entirely; `duplex` halves sheets
# for the documents that remain.
# ---------------------------------------------------------------------------
scenarios:
  - key: S0
    label: "Current practice"
    note: "Single-sided printing of all self-printed output; the antenatal booklet is a purchased, pre-printed double-sided item"
    duplex: false
    drop: []
  - key: S1
    label: "Duplex printing"
    note: "No investment; the pre-printed antenatal booklet is already double-sided"
    duplex: true
    drop: []
  - key: S2
    label: "Electronic result delivery"
    note: "Diagnostic reports retrieved from the national exchange, referrals still printed"
    duplex: true
    drop: [lab_res, abo_res, mic_res, usg_res]
  - key: S3
    label: "Paperless pathway"
    note: "Only the patient-held antenatal booklet remains on paper"
    duplex: false
    drop: [lab_ref, lab_res, abo_ref, abo_res, mic_ref, mic_res, usg_res, ward, birth]
